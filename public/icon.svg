<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Degradado de fondo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Resplandor del rayo / señal -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Barra alcista verde esmeralda -->
    <linearGradient id="bullGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Filtro de sombra y brillo exterior -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#6366f1" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Base Squircle Estilo App Icon iOS -->
  <rect x="16" y="16" width="480" height="480" rx="115" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="6"/>

  <!-- Brillo sutil de fondo -->
  <circle cx="256" cy="240" r="160" fill="#6366f1" opacity="0.18" filter="blur(40px)"/>

  <!-- Barras de trading de fondo (Sutiles) -->
  <rect x="135" y="270" width="18" height="70" rx="9" fill="rgba(255,255,255,0.08)"/>
  <rect x="360" y="170" width="18" height="110" rx="9" fill="url(#bullGrad)" opacity="0.8"/>

  <!-- Símbolo Central: Rayo Dinámico Ultra-Rápido -->
  <path d="M 295 85
           L 175 265
           L 245 265
           L 205 425
           L 345 235
           L 275 235
           Z"
        fill="url(#boltGrad)"
        filter="url(#glow)"/>

  <!-- Indicador de señal en vivo (Punto pulsante superior derecho) -->
  <circle cx="369" cy="140" r="12" fill="#10b981"/>
  <circle cx="369" cy="140" r="22" stroke="#10b981" stroke-width="4" fill="none" opacity="0.6"/>
</svg>
