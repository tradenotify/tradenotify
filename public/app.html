<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TradeNotify - Panel Alumno</title>
  <link rel="icon" type="image/png" href="/icon.png">

  <style>
    :root {
      --bg: #070913; --glass-bg: rgba(18, 24, 38, 0.75); --glass-border: rgba(255, 255, 255, 0.09);
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #d946ef 100%);
      --accent-glow: rgba(99, 102, 241, 0.35);
      --text: #f8fafc; --text-muted: #94a3b8; --green: #10b981; --red: #ef4444;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
    
    .card { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 20px; padding: 24px; max-width: 500px; width: 100%; backdrop-filter: blur(20px); box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
    
    .trial-banner { background: rgba(99, 102, 241, 0.15); border: 1px solid rgba(129, 140, 248, 0.3); border-radius: 10px; padding: 10px; font-size: 12px; text-align: center; margin-bottom: 20px; color: #c7d2fe; }
    
    .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--glass-border); padding-bottom: 12px; }
    .brand-header { display: flex; align-items: center; gap: 10px; }
    .brand-header img { width: 38px; height: 38px; border-radius: 10px; box-shadow: 0 0 15px var(--accent-glow); }

    .live-badge { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--green); background: rgba(16, 185, 129, 0.1); padding: 4px 10px; border-radius: 20px; border: 1px solid rgba(16,185,129,0.2); font-weight: 700; }
    
    .token-row { background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; font-family: var(--mono); font-size: 11px; color: #94a3b8; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    
    .feed-container { max-height: 280px; overflow-y: auto; border: 1px solid var(--glass-border); border-radius: 12px; padding: 10px; background: rgba(0,0,0,0.2); }
    .alert-item { background: rgba(255,255,255,0.03); border-radius: 8px; padding: 12px; margin-bottom: 8px; border-left: 3px solid #6366f1; }
    .alert-item.buy { border-left-color: var(--green); }
    .alert-item.sell { border-left-color: var(--red); }
    .alert-title { font-weight: 700; font-size: 13px; color: #fff; }
    .alert-body { font-size: 12px; color: #cbd5e1; margin-top: 4px; font-family: var(--mono); }
    .alert-time { font-size: 10px; color: #64748b; margin-bottom: 4px; }

    .actions-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 16px; }
    button { padding: 10px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; font-size: 11px; }
    .btn-main { background: var(--accent-gradient); color: #fff; box-shadow: 0 4px 15px var(--accent-glow); }
    .btn-secondary { background: rgba(255,255,255,0.05); color: #cbd5e1; border: 1px solid var(--glass-border); }
    .btn-danger { background: rgba(239, 68, 68, 0.08); color: #f87171; border: 1px solid rgba(239,68,68,0.2); }
    
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 999; backdrop-filter: blur(4px); }
    .modal-content { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 16px; padding: 20px; max-width: 350px; width: 100%; text-align: center; }
  </style>
</head>
<body>

  <div class="card">
    <!-- VISTA SUSCRIPCIÓN -->
    <div id="viewSubscribe" style="text-align: center;">
      <img src="/icon.png" alt="TradeNotify Logo" style="width: 54px; height: 54px; border-radius: 14px; box-shadow: 0 0 20px var(--accent-glow); margin-bottom: 12px;">
      <h2 style="margin-bottom: 6px; font-size: 20px; color: #fff;">TradeNotify Alumno</h2>
      <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 20px;">Accede a tus alertas en tiempo real</p>
      
      <input type="text" id="tokenInput" placeholder="Token del Canal" style="width:100%; padding:12px; border-radius:8px; border:1px solid #334155; background:#0f172a; color:#fff; margin-bottom:10px; outline:none;">
      <input type="text" id="inviteCodeInput" placeholder="Código Invitación (Opcional)" style="width:100%; padding:12px; border-radius:8px; border:1px solid #334155; background:#0f172a; color:#fff; margin-bottom:12px; outline:none;">
      <button class="btn-main" style="width:100%;" onclick="vincularCanal()">Conectar Dispositivo</button>
    </div>

    <!-- VISTA LIVE -->
    <div id="viewLive" style="display: none;">
      <div id="trialBanner" style="display:none; background:rgba(99,102,241,0.1); padding:8px; border-radius:8px; font-size:11px; text-align:center; color:#c7d2fe; margin-bottom:15px;">⏳ Prueba: quedan <b id="trialDaysCount">14</b> días. <a href="/#planes" style="color:#fff;"><b>Mejorar Plan</b></a></div>
      
      <div class="header-top">
        <div class="brand-header">
          <img src="/icon.png" alt="Logo">
          <div>
            <div style="font-size:9px; color:var(--text-muted); text-transform: uppercase;">CANAL</div>
            <h2 id="channelTitle" style="font-size:14px; color:#fff;">-</h2>
          </div>
        </div>
        <div class="live-badge">EN VIVO</div>
      </div>

      <div class="token-row">
        <span id="displayToken">tn_...</span>
        <button onclick="copyToken()" style="background:transparent; color:#fff; padding:0; border:none; font-size:10px; cursor:pointer;">Copiar ID</button>
      </div>

      <div id="feedList" class="feed-container"></div>
      <div id="lastSync" style="font-size:9px; color:#475569; text-align:center; margin-top:8px;">Sincronizando...</div>

      <div class="actions-grid">
        <button class="btn-main" onclick="cargarHistorial()">🔄 Refrescar</button>
        <button class="btn-secondary" onclick="testSonido()">🔔 Test</button>
        <button class="btn-danger" onclick="desvincular()">❌ Salir</button>
      </div>
    </div>
  </div>

  <div id="modalAlert" class="modal-overlay">
    <div class="modal-content">
      <h3 id="modalMsg" style="margin-bottom:20px; font-size:16px;">Mensaje</h3>
      <button class="btn-main" onclick="closeModal()">Aceptar</button>
    </div>
  </div>

  <script>
    const savedToken = localStorage.getItem('tradenotify_token');
    if (savedToken) mostrarPanelLive(savedToken);

    function customAlert(msg) { document.getElementById('modalMsg').innerText = msg; document.getElementById('modalAlert').style.display = 'flex'; }
    function closeModal() { document.getElementById('modalAlert').style.display = 'none'; }
    function testSonido() { new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg').play(); customAlert("Sonido de prueba emitido."); }

    async function vincularCanal() {
      const token = document.getElementById('tokenInput').value.trim();
      const code = document.getElementById('inviteCodeInput').value.trim();
      if (!token) return customAlert('Token necesario');
      if(code) { await fetch('/api/redeem-code', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({student_token:token, code}) }); }
      localStorage.setItem('tradenotify_token', token);
      mostrarPanelLive(token);
    }

    function mostrarPanelLive(token) {
      document.getElementById('viewSubscribe').style.display = 'none';
      document.getElementById('viewLive').style.display = 'block';
      document.getElementById('displayToken').innerText = token.substring(0, 15) + '...';
      cargarHistorial(token);
    }

    async function cargarHistorial(tokenParam) {
      const token = tokenParam || localStorage.getItem('tradenotify_token');
      try {
        const res = await fetch(`/api/alerts?token=${token}`);
        const data = await res.json();
        if(res.ok) {
          document.getElementById('channelTitle').innerText = data.channel.name;
          document.getElementById('lastSync').innerText = 'Última actualización: hace segundos';
          
          if(data.channel.is_trial) {
            document.getElementById('trialBanner').style.display = 'block';
            document.getElementById('trialDaysCount').innerText = data.channel.days_left;
          }
          
          document.getElementById('feedList').innerHTML = data.alerts.length ? data.alerts.map(a => {
            const title = (a.payload.title || '').toUpperCase();
            let cls = '';
            if(title.includes('BUY') || title.includes('COMPRA')) cls = 'buy';
            else if(title.includes('SELL') || title.includes('VENTA')) cls = 'sell';
            return `
            <div class="alert-item ${cls}">
              <div class="alert-time">${new Date(a.created_at).toLocaleTimeString()}</div>
              <div class="alert-title">${a.payload.title || 'Alerta'}</div>
              <div class="alert-body">${a.payload.message || ''}</div>
            </div>`}).join('') : '<p style="text-align:center; color:#475569; padding:20px; font-size:12px;">Esperando señales de tu mentor...</p>';
        }
      } catch(e) { document.getElementById('lastSync').innerText = 'Error al sincronizar'; }
    }

    function copyToken() { navigator.clipboard.writeText(localStorage.getItem('tradenotify_token')); customAlert('Token copiado'); }
    function desvincular() { localStorage.removeItem('tradenotify_token'); location.reload(); }
  </script>
</body>
</html>
