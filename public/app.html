<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TradeNotify - Alertas en Vivo</title>
  <link rel="icon" type="image/png" href="/icon.png">

  <style>
    :root {
      --bg: #070913;
      --glass-bg: rgba(18, 24, 38, 0.75);
      --glass-border: rgba(255, 255, 255, 0.09);
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #d946ef 100%);
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    
    .card { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 20px; padding: 24px; max-width: 500px; width: 100%; backdrop-filter: blur(20px); box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
    
    .trial-banner { background: rgba(99, 102, 241, 0.15); border: 1px solid rgba(129, 140, 248, 0.3); border-radius: 12px; padding: 12px; font-size: 13px; text-align: center; margin-bottom: 20px; color: #c7d2fe; }
    
    .status-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .channel-info h2 { font-size: 18px; font-weight: 800; }
    .live-dot { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #10b981; }

    .token-row { background: rgba(0,0,0,0.3); padding: 10px 14px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; font-family: monospace; font-size: 12px; color: #94a3b8; margin-bottom: 20px; }
    
    .feed-container { max-height: 350px; overflow-y: auto; border: 1px solid var(--glass-border); border-radius: 12px; padding: 10px; background: rgba(0,0,0,0.2); }
    .alert-item { background: rgba(255,255,255,0.03); border-radius: 8px; padding: 12px; margin-bottom: 8px; border-left: 3px solid #6366f1; }
    .alert-title { font-weight: 700; font-size: 13px; color: #fff; }
    .alert-body { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    .alert-time { font-size: 10px; color: #475569; margin-bottom: 4px; }

    .actions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
    button { padding: 12px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-main { background: var(--accent-gradient); color: white; }
    .btn-danger { background: rgba(239, 68, 68, 0.1); color: #f87171; border: 1px solid rgba(239,68,68,0.2); }
  </style>
</head>
<body>

  <div class="card" id="appContainer">
    <!-- VISTA SUBSCRIPCIÓN (Simplificada) -->
    <div id="viewSubscribe">
      <h1 style="text-align:center; margin-bottom:20px;">TradeNotify Alumno</h1>
      <input type="text" id="tokenInput" placeholder="Token del Canal" style="width:100%; padding:12px; border-radius:8px; border:1px solid #334155; background:#0f172a; color:#fff; margin-bottom:10px;">
      <button class="btn-main" style="width:100%;" onclick="vincularCanal()">Acceder a mi Canal</button>
    </div>

    <!-- VISTA LIVE -->
    <div id="viewLive" style="display: none;">
      <div id="trialBanner" class="trial-banner" style="display:none;">⏳ Prueba: quedan <b id="trialDaysCount">14</b> días. <a href="/#planes" style="color:#fff;"><b>Mejorar Plan</b></a></div>
      
      <div class="status-bar">
        <div class="channel-info"><div style="font-size:10px; color:#64748b; text-transform:uppercase;">Canal</div><h2 id="channelTitle">-</h2></div>
        <div class="live-dot"><div style="width:8px; height:8px; background:#10b981; border-radius:50%;"></div> En vivo</div>
      </div>

      <div class="token-row">
        <span id="displayToken">tn_...</span>
        <button onclick="copyToken()" style="background:transparent; color:#fff; padding:0; font-size:11px;">Copiar ID</button>
      </div>

      <div id="feedList" class="feed-container"></div>

      <div class="actions-grid">
        <button class="btn-main" onclick="cargarHistorial()">🔄 Refrescar</button>
        <button class="btn-danger" onclick="desvincular()">❌ Desconectar</button>
      </div>
    </div>
  </div>

  <script>
    const savedToken = localStorage.getItem('tradenotify_token');
    if (savedToken) mostrarPanelLive(savedToken);

    async function vincularCanal() {
      const token = document.getElementById('tokenInput').value.trim();
      if (!token) return alert('Token necesario');
      localStorage.setItem('tradenotify_token', token);
      mostrarPanelLive(token);
    }

    function mostrarPanelLive(token) {
      document.getElementById('viewSubscribe').style.display = 'none';
      document.getElementById('viewLive').style.display = 'block';
      document.getElementById('displayToken').innerText = token.substring(0, 15) + '...';
      cargarHistorial(token);
    }

    async function cargarHistorial() {
      const token = localStorage.getItem('tradenotify_token');
      const res = await fetch(`/api/alerts?token=${token}`);
      const data = await res.json();
      if(res.ok) {
        document.getElementById('channelTitle').innerText = data.channel.name;
        if(data.channel.is_trial) {
          document.getElementById('trialBanner').style.display = 'block';
          document.getElementById('trialDaysCount').innerText = data.channel.days_left;
        }
        document.getElementById('feedList').innerHTML = data.alerts.length ? data.alerts.map(a => `
          <div class="alert-item">
            <div class="alert-time">${new Date(a.created_at).toLocaleTimeString()}</div>
            <div class="alert-title">${a.payload.title || 'Alerta'}</div>
            <div class="alert-body">${a.payload.message || ''}</div>
          </div>`).join('') : '<p style="text-align:center; color:#475569; padding:20px;">Sin alertas aún.</p>';
      }
    }

    function copyToken() { navigator.clipboard.writeText(localStorage.getItem('tradenotify_token')); alert('Copiado'); }
    function desvincular() { localStorage.removeItem('tradenotify_token'); location.reload(); }
  </script>
</body>
</html>
