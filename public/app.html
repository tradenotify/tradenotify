<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TradeNotify - Alertas en Vivo</title>
  <link rel="icon" type="image/png" href="/icon.png">
  <meta name="theme-color" content="#070913">

  <style>
    :root {
      --bg: #070913;
      --glass-bg: rgba(18, 24, 38, 0.75);
      --glass-border: rgba(255, 255, 255, 0.09);
      --glass-border-top: rgba(255, 255, 255, 0.18);
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #d946ef 100%);
      --accent-glow: rgba(99, 102, 241, 0.35);
      --green: #10b981;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--bg);
      background-image: radial-gradient(circle at 50% 10%, rgba(99, 102, 241, 0.12) 0%, transparent 50%);
      background-attachment: fixed;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px;
    }

    .card {
      background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 20px;
      padding: 26px; max-width: 480px; width: 100%; backdrop-filter: blur(20px); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    .header { text-align: center; margin-bottom: 20px; }
    .header img { width: 50px; height: 50px; border-radius: 14px; box-shadow: 0 0 20px var(--accent-glow); margin-bottom: 8px; }
    
    input { width: 100%; padding: 14px; background: rgba(10, 14, 23, 0.75); border: 1px solid var(--glass-border); border-radius: 10px; color: #fff; font-size: 14px; margin-bottom: 10px; }
    
    button { width: 100%; padding: 13px; background: var(--accent-gradient); border: none; border-radius: 10px; color: #fff; font-weight: 600; cursor: pointer; }
    button.btn-secondary { background: rgba(255, 255, 255, 0.05); }

    .status-msg { margin-top: 10px; font-size: 12px; text-align: center; color: var(--text-muted); }

    /* DASHBOARD */
    .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .live-badge { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--green); background: rgba(16, 185, 129, 0.1); padding: 4px 8px; border-radius: 20px; }
    
    .token-display { background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; font-family: var(--mono); font-size: 12px; color: #94a3b8; display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }

    .alert-card { background: rgba(10, 14, 23, 0.6); border-left: 3px solid #6366f1; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
    .alert-time { font-size: 10px; color: #64748b; }
    .alert-title { font-size: 13px; font-weight: 700; color: #fff; }
    .alert-body { font-size: 12px; color: #cbd5e1; margin-top: 4px; }
    
    .trial-banner { background: rgba(99, 102, 241, 0.15); border: 1px solid rgba(129, 140, 248, 0.3); border-radius: 10px; padding: 10px; font-size: 12px; color: #c7d2fe; text-align: center; margin-bottom: 16px; }
  </style>
</head>
<body>

  <div class="card" id="appContainer">
    <!-- VISTA SUSCRIPCIÓN -->
    <div id="viewSubscribe">
      <div class="header">
        <img src="/icon.png" alt="Logo">
        <h1>TradeNotify Alumno</h1>
        <p style="color:var(--text-muted); font-size:13px;">Accede a tus alertas en tiempo real.</p>
      </div>

      <input type="text" id="tokenInput" placeholder="Token del Canal">
      <input type="text" id="inviteCodeInput" placeholder="Código Invitación (Opcional)">
      <button onclick="vincularCanal()">Conectar Dispositivo</button>

      <div id="createBox" class="register-box" style="margin-top:20px; padding:15px; background:rgba(255,255,255,0.02); border-radius:12px;">
        <p style="font-size:12px; color:var(--text-muted); margin-bottom:10px; text-align:center;">¿Nuevo? Crea tu canal gratuito:</p>
        <input type="text" id="newNameInput" placeholder="Alias (Ej: Trader_X)">
        <button id="btnCreate" class="btn-secondary" onclick="crearCanalAlumno()">Crear mi Canal Gratis</button>
      </div>
      <div id="statusMsg" class="status-msg"></div>
    </div>

    <!-- VISTA LIVE -->
    <div id="viewLive" style="display: none;">
      <div id="trialBanner" class="trial-banner" style="display: none;">
        ⏳ <b>Prueba:</b> Te quedan <b id="trialDaysCount">14</b> días. <a href="/#planes" style="color:#fff; font-weight:bold;">Mejorar Plan →</a>
      </div>
      
      <div class="dashboard-header">
        <div>
          <div style="font-size: 10px; color: var(--text-muted); text-transform: uppercase;">Tu Canal</div>
          <div id="channelTitle" style="font-weight: 700; color: #fff;">-</div>
        </div>
        <div class="live-badge"><div style="width:6px; height:6px; background:var(--green); border-radius:50%;"></div> En vivo</div>
      </div>

      <div class="token-display">
        <span id="displayToken">-</span>
        <button onclick="copyToken()" style="width:auto; padding: 4px 8px; font-size:10px;">Copiar</button>
      </div>

      <div id="feedList" style="max-height: 300px; overflow-y:auto;"></div>

      <div style="display: flex; gap: 8px; margin-top: 20px;">
        <button class="btn-secondary" onclick="cargarHistorial()">🔄</button>
        <button class="btn-secondary" style="color:#f87171;" onclick="desvincular()">Desconectar</button>
      </div>
    </div>
  </div>

  <script>
    // 1. Anti-Abuse: Bloquear creación si ya existe en este navegador
    if (localStorage.getItem('tradenotify_channel_created') === 'true') {
        document.getElementById('createBox').style.display = 'none';
    }

    const savedToken = localStorage.getItem('tradenotify_token');
    if (savedToken) {
      document.getElementById('tokenInput').value = savedToken;
      mostrarPanelLive(savedToken);
    }

    async function crearCanalAlumno() {
      const name = document.getElementById('newNameInput').value.trim();
      if (!name) return alert('Pon un nombre.');
      
      const res = await fetch('/api/register-channel', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ name }) });
      const data = await res.json();
      
      if(data.success) {
        localStorage.setItem('tradenotify_channel_created', 'true');
        document.getElementById('tokenInput').value = data.token;
        document.getElementById('createBox').style.display = 'none';
        alert('Canal creado. Token rellenado arriba.');
      }
    }

    async function vincularCanal() {
      const token = document.getElementById('tokenInput').value.trim();
      const code = document.getElementById('inviteCodeInput').value.trim();
      if (!token) return alert('Token necesario.');

      if(code) {
        await fetch('/api/redeem-code', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({student_token:token, code}) });
      }

      localStorage.setItem('tradenotify_token', token);
      mostrarPanelLive(token);
    }

    function mostrarPanelLive(token) {
      document.getElementById('viewSubscribe').style.display = 'none';
      document.getElementById('viewLive').style.display = 'block';
      document.getElementById('displayToken').innerText = token.substring(0, 15) + '...';
      cargarHistorial(token);
    }

    async function cargarHistorial(tokenParam) {
      const token = tokenParam || localStorage.getItem('tradenotify_token');
      const res = await fetch(`/api/alerts?token=${token}`);
      const data = await res.json();
      if(res.ok) {
        document.getElementById('channelTitle').innerText = data.channel.name;
        if(data.channel.is_trial) {
          document.getElementById('trialBanner').style.display = 'block';
          document.getElementById('trialDaysCount').innerText = data.channel.days_left;
        }
        const list = document.getElementById('feedList');
        list.innerHTML = data.alerts.map(a => `<div class="alert-card"><div class="alert-time">${new Date(a.created_at).toLocaleTimeString()}</div><div class="alert-title">${a.payload.title}</div><div class="alert-body">${a.payload.message}</div></div>`).join('');
      }
    }

    function desvincular() { localStorage.removeItem('tradenotify_token'); location.reload(); }
    function copyToken() { navigator.clipboard.writeText(localStorage.getItem('tradenotify_token')); alert('Token copiado'); }
  </script>
</body>
</html>
