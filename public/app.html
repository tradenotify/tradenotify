<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TradeNotify - Panel Alumno</title>
  <link rel="icon" type="image/png" href="/icon.png">

  <style>
    :root {
      --bg: #070913; --glass-bg: rgba(18, 24, 38, 0.75); --glass-border: rgba(255, 255, 255, 0.09);
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #d946ef 100%);
      --text: #f8fafc; --text-muted: #94a3b8; --green: #10b981; --red: #ef4444;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
    
    .card { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 20px; padding: 24px; max-width: 480px; width: 100%; backdrop-filter: blur(20px); box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
    
    /* En vivo badge */
    .live-badge { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--green); background: rgba(16, 185, 129, 0.15); padding: 4px 10px; border-radius: 20px; border: 1px solid rgba(16, 185, 129, 0.2); }
    .pulse-dot { width: 8px; height: 8px; background: var(--green); border-radius: 50%; animation: pulse 1.8s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

    /* Modales */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 999; backdrop-filter: blur(4px); }
    .modal-content { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 16px; padding: 20px; max-width: 350px; width: 100%; text-align: center; }
    
    button { width: 100%; padding: 12px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 13px; }
    .btn-main { background: var(--accent-gradient); color: #fff; }
    .btn-secondary { background: rgba(255,255,255,0.05); color: #cbd5e1; border: 1px solid var(--glass-border); margin-top: 8px; }
    .btn-danger { background: rgba(239, 68, 68, 0.1); color: #f87171; border: 1px solid rgba(239,68,68,0.2); }

    .feed-container { max-height: 250px; overflow-y: auto; border: 1px solid var(--glass-border); border-radius: 12px; padding: 10px; background: rgba(0,0,0,0.2); margin: 15px 0; }
    .alert-item { background: rgba(255,255,255,0.03); border-radius: 8px; padding: 10px; margin-bottom: 8px; border-left: 3px solid #6366f1; }
  </style>
</head>
<body>

  <div class="card">
    <div id="viewSubscribe">
      <h2 style="text-align:center; margin-bottom:20px;">TradeNotify Alumno</h2>
      <input type="text" id="tokenInput" placeholder="Token del Canal" style="width:100%; padding:12px; border-radius:8px; border:1px solid #334155; background:#0f172a; color:#fff; margin-bottom:10px;">
      <button class="btn-main" onclick="vincularCanal()">Conectar</button>
    </div>

    <div id="viewLive" style="display: none;">
      <div id="trialBanner" class="trial-banner" style="display:none; font-size:11px; margin-bottom:15px; color:#c7d2fe; text-align:center;">⏳ Prueba: quedan <b id="trialDaysCount">14</b> días. <a href="/#planes" style="color:#fff;"><b>Mejorar Plan</b></a></div>
      
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <div><div style="font-size:9px; color:var(--text-muted); text-transform:uppercase;">Canal</div><div id="channelTitle" style="font-weight:800; font-size:16px;">-</div></div>
        <div class="live-badge"><div class="pulse-dot"></div> EN VIVO</div>
      </div>

      <div style="background:rgba(0,0,0,0.3); padding:10px; border-radius:8px; display:flex; justify-content:space-between; align-items:center; font-family:var(--mono); font-size:11px; color:#94a3b8;">
        <span id="displayToken">tn_...</span>
        <button onclick="copyToken()" style="width:auto; padding:4px 8px; background:rgba(255,255,255,0.1); color:#fff; font-size:10px;">Copiar ID</button>
      </div>

      <div id="feedList" class="feed-container"></div>

      <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:8px;">
        <button class="btn-main" onclick="cargarHistorial()">🔄 Refrescar</button>
        <button class="btn-secondary" onclick="testSonido()">🔔 Test</button>
        <button class="btn-danger" onclick="desvincular()">❌ Salir</button>
      </div>
    </div>
  </div>

  <!-- MODALES PERSONALIZADOS -->
  <div id="modalAlert" class="modal-overlay">
    <div class="modal-content">
      <h3 id="modalMsg" style="margin-bottom:20px;">Mensaje</h3>
      <button class="btn-main" onclick="closeModal()">Aceptar</button>
    </div>
  </div>

  <div id="modalConfirm" class="modal-overlay">
    <div class="modal-content">
      <h3>¿Seguro que deseas salir?</h3>
      <p style="font-size:12px; color:var(--text-muted); margin-bottom:20px;">Se borrarán tus credenciales de este dispositivo.</p>
      <div style="display:flex; gap:10px;">
        <button class="btn-secondary" onclick="closeConfirm()">Cancelar</button>
        <button class="btn-danger" onclick="confirmLogout()">Sí, Salir</button>
      </div>
    </div>
  </div>

  <script>
    const savedToken = localStorage.getItem('tradenotify_token');
    if (savedToken) mostrarPanelLive(savedToken);

    // Gestores de modales
    function customAlert(msg) { document.getElementById('modalMsg').innerText = msg; document.getElementById('modalAlert').style.display = 'flex'; }
    function closeModal() { document.getElementById('modalAlert').style.display = 'none'; }
    function openConfirm() { document.getElementById('modalConfirm').style.display = 'flex'; }
    function closeConfirm() { document.getElementById('modalConfirm').style.display = 'none'; }
    
    function testSonido() {
      new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg').play();
      customAlert("Sonido de prueba emitido.");
    }

    async function vincularCanal() {
      const token = document.getElementById('tokenInput').value.trim();
      if (!token) return customAlert('Token necesario');
      localStorage.setItem('tradenotify_token', token);
      mostrarPanelLive(token);
    }

    function mostrarPanelLive(token) {
      document.getElementById('viewSubscribe').style.display = 'none';
      document.getElementById('viewLive').style.display = 'block';
      document.getElementById('displayToken').innerText = token.substring(0, 15) + '...';
      cargarHistorial(token);
    }

    async function cargarHistorial(tokenParam) {
      const token = tokenParam || localStorage.getItem('tradenotify_token');
      const res = await fetch(`/api/alerts?token=${token}`);
      const data = await res.json();
      if(res.ok) {
        document.getElementById('channelTitle').innerText = data.channel.name;
        if(data.channel.is_trial) {
          document.getElementById('trialBanner').style.display = 'block';
          document.getElementById('trialDaysCount').innerText = data.channel.days_left;
        }
        document.getElementById('feedList').innerHTML = data.alerts.length ? data.alerts.map(a => `
          <div class="alert-item">
            <div class="alert-time">${new Date(a.created_at).toLocaleTimeString()}</div>
            <div class="alert-title">${a.payload.title || 'Alerta'}</div>
            <div class="alert-body">${a.payload.message || ''}</div>
          </div>`).join('') : '<p style="text-align:center; color:#475569; padding:20px; font-size:12px;">Sin alertas aún.</p>';
      }
    }

    function copyToken() { navigator.clipboard.writeText(localStorage.getItem('tradenotify_token')); customAlert('Token copiado'); }
    function desvincular() { openConfirm(); }
    function confirmLogout() { localStorage.removeItem('tradenotify_token'); location.reload(); }
  </script>
</body>
</html>
