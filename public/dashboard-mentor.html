<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TradeNotify - Panel Mentor</title>
  <link rel="icon" type="image/png" href="/icon.png">

  <style>
    :root {
      --bg: #070913; --glass-bg: rgba(18, 24, 38, 0.75); --glass-border: rgba(255, 255, 255, 0.09);
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #d946ef 100%);
      --text: #f8fafc; --text-muted: #94a3b8; --green: #10b981; --red: #ef4444;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
    
    .card { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 20px; padding: 24px; max-width: 580px; width: 100%; backdrop-filter: blur(20px); box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
    
    .trial-banner { background: rgba(99, 102, 241, 0.15); border: 1px solid rgba(129, 140, 248, 0.3); border-radius: 10px; padding: 10px; font-size: 12px; text-align: center; margin-bottom: 20px; color: #c7d2fe; }
    
    .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--glass-border); padding-bottom: 12px; }
    .btn-icon { background: rgba(255, 255, 255, 0.04); border: 1px solid var(--glass-border); color: var(--text); padding: 8px 12px; border-radius: 8px; font-size: 11px; cursor: pointer; }

    .config-box { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--glass-border); }
    .config-box label { font-size: 10px; color: #a5b4fc; text-transform: uppercase; font-weight: 700; display: block; margin-bottom: 8px; }
    .code-snippet { background: #000; padding: 8px; border-radius: 6px; font-family: var(--mono); font-size: 10px; color: #93c5fd; overflow-x: auto; margin-bottom: 8px; }

    .metrics-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
    .metric-card { background: rgba(10, 14, 23, 0.6); border: 1px solid var(--glass-border); border-radius: 12px; padding: 12px; text-align: center; }
    .metric-value { font-size: 18px; font-weight: 800; color: #fff; }
    .metric-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; }

    .list-container { max-height: 150px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 4px; }
    .list-item { background: rgba(10, 14, 23, 0.75); border: 1px solid var(--glass-border); border-radius: 10px; padding: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
    
    button { padding: 12px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 13px; }
    .btn-main { background: var(--accent-gradient); color: #fff; width: 100%; }
    .btn-danger { background: rgba(239, 68, 68, 0.1); color: #f87171; border: 1px solid rgba(239,68,68,0.2); font-size: 11px; padding: 6px; }
    
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 999; }
    .modal-content { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 16px; padding: 20px; max-width: 350px; width: 100%; text-align: center; }
  </style>
</head>
<body>

  <div class="card">
    <!-- Auth -->
    <div id="authSection">
      <h2 style="text-align:center; margin-bottom:20px;">Panel Mentor</h2>
      <input type="text" id="mentorToken" placeholder="Token Mentor" style="width:100%; padding:12px; border-radius:8px; border:1px solid #334155; background:#0f172a; color:#fff; margin-bottom:10px;">
      <button class="btn-main" onclick="verificarMentor()">Acceder</button>
      <div id="authStatus" style="font-size:12px; color:#f87171; margin-top:10px; text-align:center;"></div>
    </div>

    <!-- Dashboard -->
    <div id="dashboardSection" style="display:none;">
      <div id="trialBanner" class="trial-banner" style="display:none;">⏳ Prueba: quedan <b id="trialDaysCount">14</b> días. <a href="/#planes" style="color:#fff;"><b>Mejorar Plan</b></a></div>
      
      <div class="header-top">
        <div><div style="font-size:9px; color:var(--text-muted);">MENTOR</div><h2 id="mentorChannelName">-</h2></div>
        <div class="header-actions">
          <button class="btn-icon" onclick="recargarDatosMentor()">🔄</button>
          <button class="btn-icon" style="color:var(--red);" onclick="cerrarSesion()">🚪</button>
        </div>
      </div>

      <!-- Configuración Webhook -->
      <div class="config-box">
        <label>🔗 Guía de Webhook</label>
        <input type="text" id="mentorWebhookUrl" class="webhook-input" readonly style="width:100%; padding:8px; background:#000; color:#93c5fd; font-family:var(--mono); font-size:10px; border-radius:6px; border:none; margin-bottom:8px;">
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:5px;">
          <button class="btn-icon" onclick="copiarTexto('mentorWebhookUrl')">📋 Copiar URL</button>
          <button class="btn-icon" style="color:var(--green);" onclick="enviarTestAlerta()">🧪 Enviar Test</button>
        </div>
        <label style="margin-top:10px;">JSON TradingView</label>
        <div class="code-snippet" id="jsonSnippet">{"title": "🟢 Alerta", "message": "Tu señal aquí"}</div>
        <button class="btn-icon" onclick="copiarTexto('jsonSnippet')">📋 Copiar JSON</button>
      </div>

      <div class="metrics-grid">
        <div class="metric-card"><div id="metricActive" class="metric-value">0</div><div class="metric-label">Activos</div></div>
        <div class="metric-card"><div id="metricHistoric" class="metric-value">0</div><div class="metric-label">Históricos</div></div>
        <div class="metric-card"><div id="metricPeak" class="metric-value" style="font-size:12px; padding-top:4px;">-</div><div class="metric-label">Pico</div></div>
      </div>

      <button class="btn-main" style="width:100%; margin-bottom:15px;" onclick="generarCodigo()">+ Generar Invitación</button>

      <div style="font-size:12px; color:#a5b4fc; font-weight:700; margin-bottom:8px;">🎟️ Códigos <span id="codesCountBadge">(0 / 50)</span></div>
      <div id="codesList" class="list-container"></div>

      <div style="font-size:12px; color:#a5b4fc; font-weight:700; margin-top:15px; margin-bottom:8px;">🎓 Alumnos</div>
      <input type="text" id="searchStudentInput" placeholder="🔍 Buscar alumno..." style="width:100%; padding:8px; border-radius:8px; border:none; background:rgba(0,0,0,0.3); color:#fff; font-size:12px; margin-bottom:10px;" oninput="filtrarAlumnos()">
      <div id="studentsList" class="list-container"></div>
    </div>
  </div>

  <div id="revokeModal" class="modal-overlay">
    <div class="modal-content">
      <h3>⚠️ ¿Revocar alumno?</h3>
      <p style="font-size:12px; color:var(--text-muted); margin:15px 0;">Se moverá al histórico.</p>
      <div style="display:flex; gap:10px;"><button class="btn-secondary" onclick="cerrarModalRevoke()">Cancelar</button><button class="btn-danger" onclick="ejecutarRevocacion()">Sí, Revocar</button></div>
    </div>
  </div>

  <script>
    let studentToRevokeId = null;
    let cachedActiveStudents = [];

    const savedMentorToken = localStorage.getItem('mentor_token');
    if (savedMentorToken) { document.getElementById('mentorToken').value = savedMentorToken; verificarMentor(true); }

    async function verificarMentor(auto = false) {
      const token = document.getElementById('mentorToken').value.trim();
      if (!token) return;
      try {
        const res = await fetch(`/api/alerts?token=${token}`);
        const data = await res.json();
        if (res.ok && data.channel.role === 'mentor') {
          localStorage.setItem('mentor_token', token);
          document.getElementById('authSection').style.display = 'none';
          document.getElementById('dashboardSection').style.display = 'block';
          document.getElementById('mentorChannelName').innerText = data.channel.name;
          document.getElementById('mentorWebhookUrl').value = `https://tradenotify-lac.vercel.app/api/webhook?token=${token}`;
          if(data.channel.is_trial) {
            document.getElementById('trialBanner').style.display = 'block';
            document.getElementById('trialDaysCount').innerText = data.channel.days_left;
          }
          cargarDatosMentor(token);
        } else if (!auto) document.getElementById('authStatus').innerText = '❌ Acceso denegado.';
      } catch (e) { document.getElementById('authStatus').innerText = '❌ Error de red.'; }
    }

    function recargarDatosMentor() { const token = localStorage.getItem('mentor_token'); if (token) cargarDatosMentor(token); }
    function copiarTexto(id) { navigator.clipboard.writeText(document.getElementById(id).value || document.getElementById(id).innerText); alert('Copiado'); }
    async function enviarTestAlerta() {
      const token = localStorage.getItem('mentor_token');
      await fetch(`/api/webhook?token=${token}`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ title: "🧪 Test", message: "Sistema operativo." }) });
      alert('Test enviado.');
    }
    
    async function cargarDatosMentor(token) {
      const [resCodes, resStudents] = await Promise.all([fetch(`/api/list-codes?token=${token}`), fetch(`/api/mentor-students?token=${token}`)]);
      const dataCodes = await resCodes.json();
      const dataStudents = await resStudents.json();
      
      const codes = dataCodes.codes || [];
      document.getElementById('codesCountBadge').innerText = `(${codes.length} / 50)`;
      document.getElementById('codesList').innerHTML = codes.length === 0 ? '<div style="color:#64748b; font-size:11px; text-align:center;">Sin códigos.</div>' : codes.map(c => `<div class="list-item"><span style="font-family:var(--mono); color:#93c5fd;">${c.code}</span><span class="${c.is_used ? 'color:var(--red);' : 'color:var(--green);'} font-weight:700; font-size:10px;">${c.is_used ? 'USADO' : 'ACTIVO'}</span></div>`).join('');

      cachedActiveStudents = (dataStudents.students || []).filter(s => s.status !== 'revoked');
      document.getElementById('metricActive').innerText = cachedActiveStudents.length;
      document.getElementById('metricHistoric').innerText = (dataStudents.students || []).length;
      
      renderizarAlumnos(cachedActiveStudents);
    }

    function renderizarAlumnos(lista) {
      document.getElementById('studentsList').innerHTML = lista.length === 0 ? '<div style="color:#64748b; font-size:11px; text-align:center;">Sin alumnos.</div>' : lista.map(s => `<div class="list-item"><div>${s.channels?.name || 'Alumno'}</div><button class="btn-danger" onclick="abrirModalRevoke('${s.id}')">Revocar</button></div>`).join('');
    }

    function filtrarAlumnos() {
      const query = document.getElementById('searchStudentInput').value.toLowerCase();
      renderizarAlumnos(cachedActiveStudents.filter(s => (s.channels?.name || '').toLowerCase().includes(query)));
    }

    async function generarCodigo() {
      const token = localStorage.getItem('mentor_token');
      await fetch(`/api/generate-code?token=${token}`, { method: 'POST' });
      cargarDatosMentor(token);
    }

    function abrirModalRevoke(id) { studentToRevokeId = id; document.getElementById('revokeModal').style.display = 'flex'; }
    function cerrarModalRevoke() { document.getElementById('revokeModal').style.display = 'none'; }
    async function ejecutarRevocacion() {
      const token = localStorage.getItem('mentor_token');
      await fetch('/api/mentor-students', { method: 'DELETE', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ token, mentorship_id: studentToRevokeId }) });
      cerrarModalRevoke();
      cargarDatosMentor(token);
    }
    function cerrarSesion() { localStorage.removeItem('mentor_token'); location.reload(); }
  </script>
</body>
</html>
