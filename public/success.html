<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>¡Bienvenido a TradeNotify!</title>

  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TradeNotify">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0e14;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 16px;
      padding: 28px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      text-align: center;
    }
    .success-icon { font-size: 48px; margin-bottom: 12px; }
    h1 { font-size: 22px; color: #3fb950; margin-bottom: 6px; }
    p.subtitle { color: #8b949e; font-size: 14px; margin-bottom: 24px; line-height: 1.4; }
    
    .data-group {
      text-align: left;
      margin-bottom: 16px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 12px;
    }
    .data-group label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .copy-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .code-box {
      flex: 1;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 8px 10px;
      font-family: monospace;
      font-size: 12px;
      color: #79c0ff;
      overflow-x: auto;
      white-space: nowrap;
    }
    .btn-copy {
      padding: 8px 12px;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #c9d1d9;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-copy:hover { background: #30363d; color: #fff; }

    button.btn-primary {
      width: 100%;
      padding: 14px;
      background: #238636;
      border: none;
      border-radius: 8px;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }
    button.btn-primary:hover { background: #2ea043; }

    .loader {
      border: 3px solid #21262d;
      border-top: 3px solid #58a6ff;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      animation: spin 1s linear infinite;
      margin: 30px auto;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="card">
    <div id="loadingView">
      <div class="loader"></div>
      <p style="color: #8b949e; font-size: 14px;">Generando tu canal y credenciales de acceso...</p>
    </div>

    <div id="successContent" style="display: none;">
      <div class="success-icon">🎉</div>
      <h1>¡Suscripción Activada!</h1>
      <p class="subtitle">Tu canal de alertas está listo. Configura tu TradingView y vincula tu dispositivo a continuación.</p>

      <!-- URL Webhook -->
      <div class="data-group">
        <label>1. URL del Webhook (Para TradingView)</label>
        <div class="copy-row">
          <div class="code-box" id="webhookUrlDisplay">-</div>
          <button class="btn-copy" onclick="copiarTexto('webhookUrlDisplay')">📋 Copiar</button>
        </div>
      </div>

      <!-- Token -->
      <div class="data-group">
        <label>2. Tu Token Privado</label>
        <div class="copy-row">
          <div class="code-box" id="tokenDisplay">-</div>
          <button class="btn-copy" onclick="copiarTexto('tokenDisplay')">📋 Copiar</button>
        </div>
      </div>

      <!-- Botón de vinculación directa -->
      <button class="btn-primary" id="btnGoLive" onclick="irAlPanel()">
        ⚡ Ir a mi Panel de Alertas
      </button>
    </div>
  </div>

  <script>
    let activeToken = '';

    window.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(window.location.search);
      const sessionId = params.get('session_id');

      if (!sessionId) {
        document.getElementById('loadingView').innerHTML = `
          <div style="color: #f85149; font-size: 15px;">⚠️ No se encontró la sesión de compra.</div>
          <p style="margin-top: 10px; font-size: 13px;"><a href="/" style="color: #58a6ff;">Ir al inicio</a></p>
        `;
        return;
      }

      try {
        const res = await fetch(`/api/get-session?session_id=${sessionId}`);
        const data = await res.json();

        if (res.ok) {
          activeToken = data.webhook_token;
          localStorage.setItem('tradenotify_token', activeToken);

          document.getElementById('webhookUrlDisplay').innerText = data.webhook_url;
          document.getElementById('tokenDisplay').innerText = activeToken;

          document.getElementById('loadingView').style.display = 'none';
          document.getElementById('successContent').style.display = 'block';
        } else {
          throw new Error(data.error || 'Error al obtener credenciales');
        }
      } catch (e) {
        document.getElementById('loadingView').innerHTML = `
          <div style="color: #f85149; font-size: 15px;">❌ Error: ${e.message}</div>
          <p style="margin-top: 10px; font-size: 13px;"><a href="/" style="color: #58a6ff;">Ir al inicio</a></p>
        `;
      }
    });

    function copiarTexto(elementId) {
      const text = document.getElementById(elementId).innerText;
      navigator.clipboard.writeText(text);
      alert('¡Copiado al portapapeles!');
    }

    function irAlPanel() {
      window.location.href = '/';
    }
  </script>
</body>
</html>
