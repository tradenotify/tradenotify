<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>TradeNotify - Admin Panel</title>
  <style>
    :root { --bg: #070913; --glass-bg: rgba(18, 24, 38, 0.75); --glass-border: rgba(255, 255, 255, 0.09); --accent-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #d946ef 100%); --text: #f8fafc; --text-muted: #94a3b8; --red: #ef4444; }
    body { background-color: var(--bg); color: var(--text); font-family: sans-serif; padding: 20px; }
    .container { max-width: 1000px; margin: auto; }
    .card { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px; border-bottom: 1px solid var(--glass-border); text-align: left; }
    button { padding: 6px 10px; border-radius: 6px; cursor: pointer; border: none; font-weight: 600; }
    .btn-main { background: var(--accent-gradient); color: #fff; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; }
    .modal-content { background: #161b22; padding: 20px; border-radius: 12px; width: 400px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>TradeNotify Admin</h1>
    <div class="card">
      <table>
        <thead><tr><th>Nombre</th><th>Tipo</th><th>Acciones</th></tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <div id="detailsModal" class="modal-overlay">
    <div class="modal-content">
      <h3>Historial de Pagos</h3>
      <div id="paymentList" style="margin: 15px 0;"></div>
      <button onclick="document.getElementById('detailsModal').style.display='none'">Cerrar</button>
    </div>
  </div>

  <script>
    let adminSecret = sessionStorage.getItem('admin_secret');
    async function loadData() {
      const res = await fetch('/api/admin', { headers: { 'x-admin-secret': adminSecret } });
      const data = await res.json();
      const tbody = document.getElementById('tableBody');
      data.channels.forEach(ch => {
        tbody.innerHTML += `<tr>
          <td>${ch.name}</td>
          <td>${ch.plan_type}</td>
          <td><button onclick="showPayments('${ch.id}')">Info Pagos</button></td>
        </tr>`;
      });
    }
    async function showPayments(id) {
      const res = await fetch(`/api/admin?details=true&id=${id}`, { headers: { 'x-admin-secret': adminSecret } });
      const data = await res.json();
      const list = document.getElementById('paymentList');
      list.innerHTML = data.payments.length ? data.payments.map(p => `<div>${p.payment_date}: ${p.amount}€</div>`).join('') : 'Sin pagos registrados';
      document.getElementById('detailsModal').style.display = 'flex';
    }
    loadData();
  </script>
</body>
</html>
